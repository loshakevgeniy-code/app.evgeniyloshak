name: app-evgeniyloshak

services:
  app:
    container_name: app-evgeniyloshak
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: https://playlilya.ru
      APP_ORIGINS: https://playlilya.ru,https://www.playlilya.ru,https://app.evgeniyloshak.ru
      DATABASE_PATH: /data/cabinet.sqlite
      DECK_PATH: /app/private/deck.ru.json
    volumes:
      - cabinet_data:/data
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 15s

volumes:
  cabinet_data:

networks:
  proxy:
    external: true
    name: control-center_default
